name: Deploy Web to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Web target to compile and deploy'
        required: true
        default: 'wasmJs'
        type: choice
        options:
          - wasmJs
          - js

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x app/gradlew

      - name: Build Web distribution
        working-directory: app
        run: |
          if [ "${{ github.event.inputs.target }}" = "js" ]; then
            echo "Building Kotlin/JS Web distribution..."
            ./gradlew :webApp:jsBrowserDistribution --no-daemon
          else
            echo "Building Kotlin/WasmJS Web distribution..."
            ./gradlew :webApp:wasmJsBrowserDistribution --no-daemon
          fi

      - name: Determine artifact path
        id: determine-path
        run: |
          if [ "${{ github.event.inputs.target }}" = "js" ]; then
            echo "path=app/webApp/build/dist/js/productionExecutable" >> $GITHUB_OUTPUT
          else
            echo "path=app/webApp/build/dist/wasmJs/productionExecutable" >> $GITHUB_OUTPUT
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.determine-path.outputs.path }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
