name: Distribute Desktop App

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_name:
        description: 'Release Title (optional, defaults to Tag)'
        required: false
        default: ''
      target_os:
        description: 'Target OS to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - macos
          - windows
          - linux
      prerelease:
        description: 'Mark as Pre-release'
        required: false
        default: false
        type: boolean
      draft:
        description: 'Create as Draft Release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: 'desktop-release-${{ github.ref }}'
  cancel-in-progress: false

jobs:
  build-and-distribute:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            key: macos
            gradle_task: :desktopApp:packageReleaseDmg
            artifact_dir: app/desktopApp/build/compose/binaries/main-release/dmg
            artifact_ext: '*.dmg'
          - runner: windows-latest
            key: windows
            gradle_task: :desktopApp:packageReleaseMsi
            artifact_dir: app/desktopApp/build/compose/binaries/main-release/msi
            artifact_ext: '*.msi'
          - runner: ubuntu-latest
            key: linux
            gradle_task: :desktopApp:packageReleaseDeb
            artifact_dir: app/desktopApp/build/compose/binaries/main-release/deb
            artifact_ext: '*.deb'

    if: inputs.target_os == 'all' || inputs.target_os == matrix.key
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux packaging tools (Ubuntu only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew (Unix)
        if: runner.os != 'Windows'
        run: chmod +x app/gradlew

      - name: Build Desktop Distribution (${{ matrix.key }})
        working-directory: app
        run: |
          ./gradlew ${{ matrix.gradle_task }} --no-daemon --stacktrace

      - name: Generate Checksums
        shell: bash
        run: |
          cd ${{ matrix.artifact_dir }}
          for f in ${{ matrix.artifact_ext }}; do
            if [ -f "$f" ]; then
              if command -v sha256sum &> /dev/null; then
                sha256sum "$f" > "${f}.sha256"
              elif command -v shasum &> /dev/null; then
                shasum -a 256 "$f" > "${f}.sha256"
              fi
            fi
          done

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.key }}
          path: |
            ${{ matrix.artifact_dir }}/${{ matrix.artifact_ext }}
            ${{ matrix.artifact_dir }}/*.sha256
          if-no-files-found: error

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.release_name != '' && inputs.release_name || inputs.tag_name }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: |
            ${{ matrix.artifact_dir }}/${{ matrix.artifact_ext }}
            ${{ matrix.artifact_dir }}/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
