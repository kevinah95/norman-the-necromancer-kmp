name: Semantic Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: 'semantic-release-${{ github.ref }}'
  cancel-in-progress: false

jobs:
  semantic-release:
    name: Semantic Release
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_git_tag: ${{ steps.semantic.outputs.new_release_git_tag }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
      new_release_notes: ${{ steps.semantic.outputs.new_release_notes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        with:
          extra_plugins: |
            @semantic-release/exec
            @semantic-release/changelog
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  desktop-build-and-upload:
    name: Build & Upload Desktop (${{ matrix.key }})
    needs: semantic-release
    if: needs.semantic-release.outputs.new_release_published == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            key: macos
            gradle_task: :desktopApp:packageReleaseDmg
            artifact_glob: app/desktopApp/build/compose/binaries/main-release/dmg/*.dmg
          - runner: windows-latest
            key: windows
            gradle_task: :desktopApp:packageReleaseMsi
            artifact_glob: app/desktopApp/build/compose/binaries/main-release/msi/*.msi
          - runner: ubuntu-latest
            key: linux
            gradle_task: :desktopApp:packageReleaseDeb
            artifact_glob: app/desktopApp/build/compose/binaries/main-release/deb/*.deb
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.semantic-release.outputs.new_release_git_tag }}

      - name: Build, sign and upload desktop release
        uses: ./.github/actions/desktop-build-and-upload
        with:
          release_tag: ${{ needs.semantic-release.outputs.new_release_git_tag }}
          gradle_task: ${{ matrix.gradle_task }}
          artifact_glob: ${{ matrix.artifact_glob }}

  web-deploy-pages:
    name: Build & Deploy Web to GitHub Pages
    needs: semantic-release
    if: needs.semantic-release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: 'pages'
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.semantic-release.outputs.new_release_git_tag }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x app/gradlew

      - name: Build Web distribution (WasmJS)
        working-directory: app
        run: ./gradlew :webApp:wasmJsBrowserDistribution --no-daemon

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/webApp/build/dist/wasmJs/productionExecutable

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
